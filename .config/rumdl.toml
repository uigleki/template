[global]
line-length = 0

[per-file-ignores]
# a one-line `@AGENTS.md` import
"**/CLAUDE.md" = ["MD041"]

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD009]
strict = true

[MD013]
reflow = true
reflow-mode = "sentence-per-line"

[MD029]
style = "ordered"

[MD035]
style = "---"

[MD046]
style = "fenced"

[MD048]
style = "backtick"

[MD049]
style = "underscore"

[MD050]
style = "asterisk"

[MD055]
style = "leading_and_trailing"

[MD060]
enabled = true
style = "compact"

[MD076]
style = "tight"
allow-loose-continuation = true

[MD077]
style = "aligned"
