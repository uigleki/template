# Claude Code prompt files: the model already gets their path or name, so an H1 adds nothing
[per-file-ignores]
"**/.claude/**/*.md" = ["MD041"]
"**/CLAUDE.md" = ["MD041"]  # a one-line `@AGENTS.md` import
"**/SKILL.md" = ["MD041"]

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD009]
strict = true

[MD013]
code-blocks = false
reflow = true
reflow-mode = "semantic-line-breaks"

[MD029]
style = "ordered"

[MD035]
style = "---"

[MD046]
style = "fenced"

[MD048]
style = "backtick"

[MD049]
style = "underscore"

[MD050]
style = "asterisk"

[MD055]
style = "leading_and_trailing"

[MD060]
enabled = true
style = "compact"

[MD076]
style = "tight"
allow-loose-continuation = true

[MD077]
style = "aligned"
